name = "teamforge-ai"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Origins allowed to call this worker, comma-separated. One deployment is
# reachable under several names -- a custom domain plus the two Firebase
# defaults -- and the browser sends whichever the student actually loaded, so
# every host you serve TeamForge from must be listed here. The worker rejects
# all others, both in CORS headers and server-side.
[vars]
ALLOWED_ORIGINS = "https://teamforge.edutool.org,https://teamforge-b1fa9.web.app,https://teamforge-b1fa9.firebaseapp.com"
MODEL = "claude-sonnet-5"
# The real control on API-key spend: the origin check only stops browsers.
DAILY_CAP = "120"
HOURLY_PER_IP = "10"

# Rate-limit counters. Create with:
#   wrangler kv namespace create RATE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "4a6f654151e54dc5b72b4dadabfd4215"

# Secret (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY
