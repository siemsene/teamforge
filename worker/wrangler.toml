name = "teamforge-ai"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# The origin allowed to call this worker (your deployed app). Must match the
# host you serve TeamForge from; the worker rejects all other origins (CORS).
[vars]
ALLOWED_ORIGIN = "https://your-teamforge-app.example.com"
MODEL = "claude-sonnet-5"
DAILY_CAP = "500"
HOURLY_PER_IP = "10"

# Rate-limit counters. Create with:
#   wrangler kv namespace create RATE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY
